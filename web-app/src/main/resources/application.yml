spring:
  profiles:
    active: springai
  application:
    name: agent-workshop-assignments
  ai:
    mcp:
      client:
        enabled: true
        type: SYNC
        stdio:
          connections:
            location:
              command: java
              args:
                - -Dspring.ai.mcp.server.stdio=true
                - -jar
                - "${FAVOURITES_MCP_JAR:${user.dir}/favourites-mcp/target/favourites-mcp-0.0.1-SNAPSHOT.jar}"
#        sse:
#          connections:
#            favourites:
#              url: http://localhost:8081
#              sse-endpoint: /sse


openai:
  proxy:
    url: https://vfjv12h3xb.execute-api.eu-west-1.amazonaws.com
#    url:
    token:
    password: ${WORKSHOP_PASSWORD:}
    user-id: workshop-default
    cache:
      enabled: true
      location: ${user.dir}/data/token-cache.json

logging:
  level:
    root: INFO
    org.rag4j.agent: INFO
    org.springframework.ai: INFO


agent:
  plain:
    reasoning:
      max-reasoning-steps: 5
    memory:
      max-conversation-size: 10
